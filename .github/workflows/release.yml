name: Release

# v<버전> 태그를 푸시하면 Windows·macOS 설치 파일을 빌드해 GitHub 릴리스로 올린다.
# 태그 버전은 webview/pubspec.yaml 의 버전과 같아야 한다.
# 릴리스 설명은 .github/release-notes.md 를 쓴다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' webview/pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 pubspec.yaml 버전(v$version)이 다릅니다."
            exit 1
          fi

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml

  release:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -l dist
          gh release create "v$VERSION" dist/* \
            --title "Google 메시지 웹 v$VERSION" \
            --notes-file .github/release-notes.md
