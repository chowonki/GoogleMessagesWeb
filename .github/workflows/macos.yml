name: macOS installer

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macos.yml'
      - 'packages/**'
      - 'webview/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
      - name: Build and package macOS release
        working-directory: webview
        run: bash tools/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleMessagesWeb-macOS
          path: webview/dist/GoogleMessagesWeb-*.dmg
          if-no-files-found: error
