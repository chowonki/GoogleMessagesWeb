name: google_messages
description: Google Messages for Web 데스크톱 앱 (Windows / macOS)
publish_to: 'none'
version: 1.0.14+52

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  # 알림을 기본(넉넉한) 양식으로 보여 주도록 고친 사본
  local_notifier:
    path: packages/local_notifier
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  windows_single_instance: ^1.0.1
  ffi: ^2.1.3
  file_selector: ^1.0.3
  desktop_drop: any
  crypto: any
  material_symbols_icons: any
  screen_retriever: any
  pasteboard: any
  super_drag_and_drop: ^0.9.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
    - assets/tray.png
    - assets/app_icon.png

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
