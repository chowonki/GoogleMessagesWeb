name: google_messages_web
description: Google Messages for Web 을 WebView 로 감싼 데스크톱 앱 (Windows / macOS)
publish_to: 'none'
version: 1.4.0+10

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  # 기존 앱과 같은 알림 패키지 사본을 함께 쓴다
  local_notifier:
    path: ../packages/local_notifier
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  path_provider: ^2.1.4
  windows_single_instance: ^1.0.1
  windows_taskbar: ^1.1.2
  ffi: ^2.1.3

# 상태 표시줄(주소 미리보기)을 끄도록 한 줄 고친 플러그인 사본
dependency_overrides:
  flutter_inappwebview_windows:
    path: ../packages/flutter_inappwebview_windows

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray.ico
    - assets/tray.png
    - assets/app_icon.png
    - assets/badge/
    - assets/js/
    - assets/ocr/gm_ocr.exe
